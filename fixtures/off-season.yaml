# Fixture: off-season revenue decision, schema v2. Cycle 1 output, migrated; cycle 2 edits applied.
decision:
  title: Sustain revenue through the off-season (Q1'27)
  focus: off-season revenue, Jan to Mar 2027
  direction: more
  horizon: Mar 31, 2027
  out_of_scope:
    - on-season performance
    - cost-cutting for its own sake
stakeholders:
  dmer:
    name: Yana (as owner and CEO, for this exercise)
    role: owner / CEO
  other_decision_makers: []
  advisors:
    - name_or_group: sales managers
      consulted_on: advice and clarifications
  affected:
    - group: customers
      impact: direct
      has_say: "no"
    - group: employees
      impact: direct
      has_say: "no"
    - group: vendors
      impact: indirect
      has_say: "no"
    - group: family
      impact: supporting
      has_say: "no"
  no_voice: []
in_place:
  - online ordering on own site
  - fixed to-go pricing
  - non-wedding event types (events already diversified; weddings 40 to 60%)
  - price floors per service line
  - flat-rate staff scheduled first
  - smaller-format offerings
  - vendor terms for off-season volume
  - margin tracked per event or order
  - flat-rate staff scheduled before hourly (W26)
what_matters:
  - id: W1
    statement: "demand for any of our services: weddings, other events, to-go, catering"
    whose: dmer
    direction: more
    weight: important
  - id: W2
    statement: fewer corporate events after the holidays
    whose: dmer
    direction: more
    weight: important
  - id: W3
    statement: we want more sales
    whose: dmer
    direction: more
    weight: must
  - id: W4
    statement: cash flow in the off-season
    whose: dmer
    direction: more
    weight: must
  - id: W5
    statement: keeping staff busy
    whose: dmer
    direction: more
    weight: nice
    why:
      - less chance of leaving
      - consistent work keeps up quality
      - happy employees promote the brand
  - id: W6
    statement: vendor relationships
    whose: affected:vendors
    direction: keep
    weight: nice
  - id: W7
    statement: the venue sitting empty
    whose: dmer
    direction: less
    weight: nice
  - id: W8
    statement: lack of mounting debt
    whose: dmer
    direction: less
    weight: must
  - id: W9
    statement: happy staff
    whose: affected:employees
    direction: more
    weight: important
  - id: W10
    statement: engaged customer base
    whose: affected:customers
    direction: more
    weight: important
    why:
      - more events means more guests exposed to venues, food, service
      - guests bring sales, brand recognition, return customers, ratings
  - id: W11
    statement: brand recognition
    whose: dmer
    direction: more
    weight: nice
    why:
      - more business more consistently
      - shorter sales journey
      - more vendors want to work with us
      - catering clients outside venues
      - faster to-go purchases
      - employer of choice
  - id: W12
    statement: shorter sales journey (less need to persuade)
    whose: dmer
    direction: less
    weight: nice
  - id: W13
    statement: more vendors that want to work with us
    whose: affected:vendors
    direction: more
    weight: nice
  - id: W14
    statement: catering clients outside of our venues
    whose: dmer
    direction: more
    weight: important
  - id: W15
    statement: quicker purchases of our to-go
    whose: affected:customers
    direction: more
    weight: must
  - id: W16
    statement: employer of choice for high-quality employees
    whose: affected:employees
    direction: more
    weight: nice
  - id: W17
    statement: return customers
    whose: affected:customers
    direction: more
    weight: important
  - id: W18
    statement: ratings and reviews
    whose: affected:customers
    direction: more
    weight: important
  - id: W19
    statement: not discounting so deep it damages on-season pricing
    whose: dmer
    direction: keep
    weight: important
  - id: W20
    statement: not over-committing staff or cash to off-season bets that don't pay back
    whose: dmer
    direction: less
    weight: important
  - id: W21
    statement: off-season as a testing ground for new offerings
    whose: dmer
    direction: more
    weight: nice
  - id: W22
    statement: a repeatable off-season playbook
    whose: dmer
    direction: more
    weight: important
  - id: W23
    statement: growing lines that are not seasonal
    whose: dmer
    direction: more
    weight: nice
  - id: W24
    statement: get leads in Q4 (generally should be much earlier)
    whose: dmer
    direction: more
    weight: must
    by: Dec 31, 2026
  - id: W25
    statement: revenue increase cannot come with even higher costs; profitability may run below on-season for now
    whose: dmer
    direction: keep
    weight: must
  - id: W26
    statement: leverage flat-rate employees first before engaging hourly
    whose: dmer
    direction: more
    weight: important
goal:
  id: G
  text: Increase overall Q1'27 revenue to [X%] of average on-season quarterly revenue
  metric: Q1'27 revenue vs. on-season quarterly average
  target: "[X%]"
  realized_by: Mar 31, 2027
  from:
    - W1
    - W2
    - W3
    - W7
    - W14
    - W15
sub_goals:
  - id: SG1
    text: Q1'27 event revenue (weddings, corporate, venue rentals)
    share: 75
    metric: booked and realized event revenue
    booked_by: Dec 31, 2026
    realized_by: Mar 31, 2027
    from:
      - W1
      - W2
      - W24
  - id: SG2
    text: Q1'27 catering revenue outside the venues
    share: 15
    metric: booked and realized catering revenue
    booked_by: Dec 31, 2026
    realized_by: Mar 31, 2027
    from:
      - W14
      - W24
      - W23
  - id: SG3
    text: Q1'27 to-go revenue
    share: 10
    metric: booked and realized to-go revenue
    booked_by: Dec 31, 2026
    realized_by: Mar 31, 2027
    from:
      - W15
      - W24
      - W23
levers:
  - id: L1
    text: Increase marketing-sourced leads and orders in every line
    metric: leads and orders attributed to marketing, per line
    target: "[n]"
    by: Mar 31, 2027
    from:
      - W1
      - W11
      - W12
    contributes_to:
      - to: SG1
        priority: must
      - to: SG2
        priority: must
      - to: SG3
        priority: must
      - to: L6
        priority: must
  - id: L2
    text: Increase repeat bookings from past clients
    metric: share of Q1 bookings from past clients
    target: "[W%]"
    by: Mar 31, 2027
    from:
      - W10
      - W17
    contributes_to:
      - to: SG1
        priority: important
      - to: SG2
        priority: important
      - to: SG3
        priority: must
  - id: L3
    text: Increase corporate business in Q1'27
    metric: corporate bookings and orders
    target: "[$ or n]"
    by: Mar 31, 2027
    from:
      - W2
    contributes_to:
      - to: SG1
        priority: must
      - to: SG2
        priority: important
      - to: SG3
        priority: must
  - id: L4
    text: Increase vendor and planner referrals
    metric: referral-sourced leads per month
    target: "[K]"
    by: Mar 31, 2027
    from:
      - W6
      - W13
    contributes_to:
      - to: SG1
        priority: must
      - to: L6
        priority: important
  - id: L5
    text: Increase inquiry-to-booking conversion in Q1
    metric: share of Q1 inquiries that book
    target: "[C%]"
    by: Mar 31, 2027
    from:
      - W1
      - W12
    contributes_to:
      - to: SG1
        priority: must
      - to: SG2
        priority: important
      - to: L6
        priority: important
  - id: L6
    text: Increase sales team output on Q1'27 bookings
    metric: Q1 bookings closed per sales manager
    target: "[n]"
    by: Mar 31, 2027
    from:
      - W24
    contributes_to:
      - to: SG1
        priority: must
      - to: SG2
        priority: must
      - to: SG3
        priority: must
  - id: L8
    text: Test new offerings in the off-season
    metric: offerings tested, each with a go or no-go decision
    target: "[n]"
    by: Mar 31, 2027
    from:
      - W21
    contributes_to:
      - to: SG2
        priority: nice
      - to: SG3
        priority: nice
  - id: L9
    text: Increase bookings from guest and client referrals
    metric: bookings traced to a guest or client recommendation
    target: "[n]"
    by: Mar 31, 2027
    from:
      - W10
      - W17
    contributes_to:
      - to: SG1
        priority: important
      - to: SG2
        priority: nice
  - id: L10
    text: Raise ratings and review count
    metric: average rating; reviews per month
    target: "[4.x+]; [r]"
    by: Mar 31, 2027
    from:
      - W18
      - W11
    contributes_to:
      - to: L9
        priority: important
      - to: L5
        priority: important
      - to: L1
        priority: nice
guardrails:
  - id: R1
    text: Keep monthly operating cash flow positive and total debt under a ceiling
    metric: monthly cash flow; total debt
    bound: cash flow > 0; debt < [threshold]
    weight: must
    from:
      - W4
      - W8
  - id: R2
    text: Keep gross margin positive on every Q1'27 booking or order
    metric: margin per event or order
    bound: floor [Y%]
    weight: must
    from:
      - W25
  - id: R3
    text: Keep the current team through Q1'27
    metric: headcount
    bound: no off-season layoffs
    weight: important
    from:
      - W5
      - W9
      - W16
  - id: R4
    text: Hold on-season pricing and cap spend per Q1 initiative until payback
    metric: discount depth; spend per initiative
    bound: discount at most [D%]; spend at most [budget] until payback
    weight: important
    from:
      - W19
      - W20
options_parked:
  - text: Q4 paid and social campaigns
    serves: L1
  - text: catering and to-go promotions
    serves: L1
  - text: ezCater-type channels
    serves: L1
  - text: to-go offers to past guests
    serves: L1
  - text: Q1 kickoffs and off-sites
    serves: L3
  - text: corporate lunch programs
    serves: L3
  - text: planner and vendor partnerships
    serves: L4
  - text: sales incentives tied to Q1 bookings
    serves: L6
  - text: pickup and delivery windows
    serves: unassigned
    note: waits for a to-go lever
  - text: to-go as entry product to catering and events
    serves: unassigned
    note: waits for a to-go lever
  - text: Q1 pricing packages within the discount cap
    serves: L5
  - text: outreach to past clients
    serves: L2
  - text: loyalty offer for returning clients
    serves: L2
  - text: referral incentive
    serves: L9
  - text: post-event follow-up asking for an introduction
    serves: L9
  - text: review request after each event
    serves: L10
  - text: service recovery on low ratings
    serves: L10
gaps: []
notes:
  - Weddings are 40 to 60% of events; the rest is diversified, so single-driver risk was dropped
  - W22, a repeatable off-season playbook, describes the exercise itself and is not attached to a lever
  - >-
    Lever lineage from the cycle 1 rating sheet: O8 repeat and referral became L2; O9 vendor and planner referrals
    became L4; O7 non-seasonal lines became L7; O4 book Q1 revenue by Dec 31 became the booked_by dates on the
    sub-goals; sheet items L1 to L15 are options, parked by lever; L16 to L20 are in place and support R2
  - "Rating sheets in Drive: VDDM Off-Season Revenue - Value Ratings, - Lever Priorities"
  - >-
    Cycle 2, criterion test: L5 was an option (Q1 packages) and became the conversion lever; L7 duplicated SG2 and SG3
    and was removed, with W23 attached to those sub-goals; R3 kept its bound and lost its scheduling clause
  - >-
    Cycle 2, modularity: L2 split into L2 repeat bookings, L9 guest referrals, L10 ratings and reviews; ratings is an
    upstream lever feeding L9, L5 and L1
